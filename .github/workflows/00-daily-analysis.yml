          LLM_OPENROUTER_EXTRA_HEADERS: ${{ vars.LLM_OPENROUTER_EXTRA_HEADERS || secrets.LLM_OPENROUTER_EXTRA_HEADERS }}

          LLM_REQUESTY_PROTOCOL: ${{ vars.LLM_REQUESTY_PROTOCOL || secrets.LLM_REQUESTY_PROTOCOL }}
          LLM_REQUESTY_API_SURFACE: ${{ vars.LLM_REQUESTY_API_SURFACE || secrets.LLM_REQUESTY_API_SURFACE }}
          LLM_REQUESTY_BASE_URL: ${{ vars.LLM_REQUESTY_BASE_URL || secrets.LLM_REQUESTY_BASE_URL }}
          LLM_REQUESTY_API_KEY: ${{ secrets.LLM_REQUESTY_API_KEY }}
          LLM_REQUESTY_API_KEYS: ${{ secrets.LLM_REQUESTY_API_KEYS }}
          LLM_REQUESTY_MODELS: ${{ vars.LLM_REQUESTY_MODELS || secrets.LLM_REQUESTY_MODELS }}
          LLM_REQUESTY_ENABLED: ${{ vars.LLM_REQUESTY_ENABLED || secrets.LLM_REQUESTY_ENABLED }}
          LLM_REQUESTY_EXTRA_HEADERS: ${{ vars.LLM_REQUESTY_EXTRA_HEADERS || secrets.LLM_REQUESTY_EXTRA_HEADERS }}

          LLM_OLLAMA_PROTOCOL: ${{ vars.LLM_OLLAMA_PROTOCOL || secrets.LLM_OLLAMA_PROTOCOL }}
          LLM_OLLAMA_API_SURFACE: ${{ vars.LLM_OLLAMA_API_SURFACE || secrets.LLM_OLLAMA_API_SURFACE }}
          LLM_OLLAMA_BASE_URL: ${{ vars.LLM_OLLAMA_BASE_URL || secrets.LLM_OLLAMA_BASE_URL }}
          LLM_OLLAMA_API_KEY: ${{ secrets.LLM_OLLAMA_API_KEY }}
          LLM_OLLAMA_API_KEYS: ${{ secrets.LLM_OLLAMA_API_KEYS }}
          LLM_OLLAMA_MODELS: ${{ vars.LLM_OLLAMA_MODELS || secrets.LLM_OLLAMA_MODELS }}
          LLM_OLLAMA_ENABLED: ${{ vars.LLM_OLLAMA_ENABLED || secrets.LLM_OLLAMA_ENABLED }}
          LLM_OLLAMA_EXTRA_HEADERS: ${{ vars.LLM_OLLAMA_EXTRA_HEADERS || secrets.LLM_OLLAMA_EXTRA_HEADERS }}

          # ==========================================
          # 数据源
          # ==========================================
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          # Tushare Pro 自定义接入地址（可选；指向自建网关或第三方兼容镜像时设置）
          TUSHARE_HTTP_URL: ${{ vars.TUSHARE_HTTP_URL || secrets.TUSHARE_HTTP_URL }}
          # TickPlus（A 股 / ETF 首选推荐；日 K、实时指标与名称；未配置则使用其他来源）
          TICKPLUS_API_KEY: ${{ secrets.TICKPLUS_API_KEY }}
          TICKPLUS_PRIORITY: ${{ vars.TICKPLUS_PRIORITY || secrets.TICKPLUS_PRIORITY }}
          # TickFlow（保留独立能力与历史配置；含指数和大盘复盘增强）
          TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
          TICKFLOW_PRIORITY: ${{ vars.TICKFLOW_PRIORITY || secrets.TICKFLOW_PRIORITY }}
          TICKFLOW_KLINE_ADJUST: ${{ vars.TICKFLOW_KLINE_ADJUST || secrets.TICKFLOW_KLINE_ADJUST }}
          TICKFLOW_BATCH_DAILY_ENABLED: ${{ vars.TICKFLOW_BATCH_DAILY_ENABLED || secrets.TICKFLOW_BATCH_DAILY_ENABLED }}
          TICKFLOW_BATCH_SIZE: ${{ vars.TICKFLOW_BATCH_SIZE || secrets.TICKFLOW_BATCH_SIZE }}
          # Longbridge OpenAPI（美股/港股实时行情字段补充；不设则仅 YFinance/AkShare，无 [Longbridge] 调用）
          LONGBRIDGE_OAUTH_CLIENT_ID: ${{ vars.LONGBRIDGE_OAUTH_CLIENT_ID || secrets.LONGBRIDGE_OAUTH_CLIENT_ID }}
          LONGBRIDGE_OAUTH_TOKEN_CACHE_B64: ${{ secrets.LONGBRIDGE_OAUTH_TOKEN_CACHE_B64 }}
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          LONGBRIDGE_REGION: ${{ vars.LONGBRIDGE_REGION || secrets.LONGBRIDGE_REGION }}
          LONGBRIDGE_HTTP_URL: ${{ vars.LONGBRIDGE_HTTP_URL || secrets.LONGBRIDGE_HTTP_URL }}
          LONGBRIDGE_QUOTE_WS_URL: ${{ vars.LONGBRIDGE_QUOTE_WS_URL || secrets.LONGBRIDGE_QUOTE_WS_URL }}
          LONGBRIDGE_TRADE_WS_URL: ${{ vars.LONGBRIDGE_TRADE_WS_URL || secrets.LONGBRIDGE_TRADE_WS_URL }}
          LONGBRIDGE_STATIC_INFO_TTL_SECONDS: ${{ vars.LONGBRIDGE_STATIC_INFO_TTL_SECONDS || secrets.LONGBRIDGE_STATIC_INFO_TTL_SECONDS }}
          LONGBRIDGE_ENABLE_OVERNIGHT: ${{ vars.LONGBRIDGE_ENABLE_OVERNIGHT || secrets.LONGBRIDGE_ENABLE_OVERNIGHT }}
          LONGBRIDGE_PUSH_CANDLESTICK_MODE: ${{ vars.LONGBRIDGE_PUSH_CANDLESTICK_MODE || secrets.LONGBRIDGE_PUSH_CANDLESTICK_MODE }}
          LONGBRIDGE_PRINT_QUOTE_PACKAGES: ${{ vars.LONGBRIDGE_PRINT_QUOTE_PACKAGES || secrets.LONGBRIDGE_PRINT_QUOTE_PACKAGES }}
          # FXMacroData（Agent 宏观数据工具的可选授权；不设则仅使用公开 USD 数据）
          FXMACRODATA_API_KEY: ${{ secrets.FXMACRODATA_API_KEY }}
          
          # ==========================================
          # 搜索服务
          # ==========================================
          ANSPIRE_API_KEYS: ${{ secrets.ANSPIRE_API_KEYS }} 
          ANSPIRE_LLM_MODEL: ${{ vars.ANSPIRE_LLM_MODEL || secrets.ANSPIRE_LLM_MODEL }}
          ANSPIRE_LLM_BASE_URL: ${{ vars.ANSPIRE_LLM_BASE_URL || secrets.ANSPIRE_LLM_BASE_URL }}
          ANSPIRE_LLM_ENABLED: ${{ vars.ANSPIRE_LLM_ENABLED || secrets.ANSPIRE_LLM_ENABLED }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          MINIMAX_API_KEYS: ${{ secrets.MINIMAX_API_KEYS }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          SEARXNG_BASE_URLS: ${{ vars.SEARXNG_BASE_URLS || secrets.SEARXNG_BASE_URLS }}
          SEARXNG_PUBLIC_INSTANCES_ENABLED: ${{ vars.SEARXNG_PUBLIC_INSTANCES_ENABLED || secrets.SEARXNG_PUBLIC_INSTANCES_ENABLED }}
          SEARXNG_TIMEOUT_SECONDS: ${{ vars.SEARXNG_TIMEOUT_SECONDS || secrets.SEARXNG_TIMEOUT_SECONDS }}
          MX_APIKEY: ${{ secrets.MX_APIKEY }}
          MX_PRIORITY: ${{ vars.MX_PRIORITY || secrets.MX_PRIORITY }}
          
          # ==========================================
          # 通知渠道（可同时配置多个，全部推送）
          # ==========================================
          
          # 方式一：企业微信 Webhook
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          WECHAT_MSG_TYPE: ${{ vars.WECHAT_MSG_TYPE || secrets.WECHAT_MSG_TYPE || 'markdown' }}
          
          # 方式二：飞书 Webhook
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_WEBHOOK_KEYWORD: ${{ vars.FEISHU_WEBHOOK_KEYWORD || secrets.FEISHU_WEBHOOK_KEYWORD }}
          # 钉钉 Webhook
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          # 方式三：Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          
          # 方式四：邮件
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || secrets.EMAIL_SENDER_NAME || 'daily_stock_analysis股票分析助手' }}
          
          # 方式五：Pushover
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}

          # 方式五扩展：ntfy
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}

          # 方式五扩展：Gotify
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          
          # 方式六：PushPlus ⬅️ 新增！
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ vars.PUSHPLUS_TOPIC || secrets.PUSHPLUS_TOPIC }}
          
          # 方式七：自定义 Webhook（钉钉、Bark、自建服务等）
          CUSTOM_WEBHOOK_URLS: ${{ secrets.CUSTOM_WEBHOOK_URLS }}
          CUSTOM_WEBHOOK_BEARER_TOKEN: ${{ secrets.CUSTOM_WEBHOOK_BEARER_TOKEN }}
          CUSTOM_WEBHOOK_BODY_TEMPLATE: ${{ vars.CUSTOM_WEBHOOK_BODY_TEMPLATE || secrets.CUSTOM_WEBHOOK_BODY_TEMPLATE }}
          WEBHOOK_VERIFY_SSL: ${{ vars.WEBHOOK_VERIFY_SSL || secrets.WEBHOOK_VERIFY_SSL || 'true' }}
          
          # 方式八：Discord
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_MAIN_CHANNEL_ID: ${{ secrets.DISCORD_MAIN_CHANNEL_ID }}
          
          # 方式九：飞书云文档
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
          FEISHU_CHAT_ID: ${{ vars.FEISHU_CHAT_ID || secrets.FEISHU_CHAT_ID }}
          FEISHU_RECEIVE_ID_TYPE: ${{ vars.FEISHU_RECEIVE_ID_TYPE || secrets.FEISHU_RECEIVE_ID_TYPE }}
          FEISHU_DOMAIN: ${{ vars.FEISHU_DOMAIN || secrets.FEISHU_DOMAIN }}
          FEISHU_SEND_AS_FILE: ${{ vars.FEISHU_SEND_AS_FILE || secrets.FEISHU_SEND_AS_FILE }}

          # 方式十：AstrBot
          ASTRBOT_URL: ${{ secrets.ASTRBOT_URL }}
          ASTRBOT_TOKEN: ${{ secrets.ASTRBOT_TOKEN }}

          # 方式十一：Server酱3
          SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}

          # 方式十二：Slack
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

          # 通知路由策略（留空时保持全部已配置渠道）
          NOTIFICATION_REPORT_CHANNELS: ${{ vars.NOTIFICATION_REPORT_CHANNELS || secrets.NOTIFICATION_REPORT_CHANNELS }}
          NOTIFICATION_ALERT_CHANNELS: ${{ vars.NOTIFICATION_ALERT_CHANNELS || secrets.NOTIFICATION_ALERT_CHANNELS }}
          NOTIFICATION_SYSTEM_ERROR_CHANNELS: ${{ vars.NOTIFICATION_SYSTEM_ERROR_CHANNELS || secrets.NOTIFICATION_SYSTEM_ERROR_CHANNELS }}
          NOTIFICATION_DEDUP_TTL_SECONDS: ${{ vars.NOTIFICATION_DEDUP_TTL_SECONDS || secrets.NOTIFICATION_DEDUP_TTL_SECONDS || '0' }}
          NOTIFICATION_COOLDOWN_SECONDS: ${{ vars.NOTIFICATION_COOLDOWN_SECONDS || secrets.NOTIFICATION_COOLDOWN_SECONDS || '0' }}
          NOTIFICATION_QUIET_HOURS: ${{ vars.NOTIFICATION_QUIET_HOURS || secrets.NOTIFICATION_QUIET_HOURS }}
          NOTIFICATION_TIMEZONE: ${{ vars.NOTIFICATION_TIMEZONE || secrets.NOTIFICATION_TIMEZONE }}
          NOTIFICATION_MIN_SEVERITY: ${{ vars.NOTIFICATION_MIN_SEVERITY || secrets.NOTIFICATION_MIN_SEVERITY }}
          NOTIFICATION_DAILY_DIGEST_ENABLED: ${{ vars.NOTIFICATION_DAILY_DIGEST_ENABLED || secrets.NOTIFICATION_DAILY_DIGEST_ENABLED || 'false' }}

          # ==========================================
          # 自选股配置
          # ==========================================
          # 避免直接写入 STOCK_LIST，保留同名 Environment variables 的 runner 环境值。
          STOCK_LIST_CONFIG: ${{ vars.STOCK_LIST || secrets.STOCK_LIST }}
          MARKET_REVIEW_REGION: ${{ vars.MARKET_REVIEW_REGION || secrets.MARKET_REVIEW_REGION || 'tw,us' }}
          MARKET_REVIEW_COLOR_SCHEME: ${{ vars.MARKET_REVIEW_COLOR_SCHEME || secrets.MARKET_REVIEW_COLOR_SCHEME || 'red_up' }}
          
          # ==========================================
          # 运行配置 ⬅️ 新增！
          # ==========================================
          REPORT_TYPE: ${{ vars.REPORT_TYPE || secrets.REPORT_TYPE || 'simple' }}
          REPORT_LANGUAGE: ${{ vars.REPORT_LANGUAGE || secrets.REPORT_LANGUAGE || '' }}
          REPORT_SHOW_LLM_MODEL: ${{ vars.REPORT_SHOW_LLM_MODEL || secrets.REPORT_SHOW_LLM_MODEL || 'true' }}
          SINGLE_STOCK_NOTIFY: ${{ vars.SINGLE_STOCK_NOTIFY || secrets.SINGLE_STOCK_NOTIFY || 'false' }}
          MARKET_REVIEW_ENABLED: ${{ vars.MARKET_REVIEW_ENABLED || secrets.MARKET_REVIEW_ENABLED || 'true' }}
          ANALYSIS_DELAY: ${{ vars.ANALYSIS_DELAY || secrets.ANALYSIS_DELAY || '0' }}
          # 公共通達信伺服器在 GitHub Actions 上連不到，只分析台/美股時關閉以省下每次約 30 秒的連線逾時
          PYTDX_ENABLED: ${{ vars.PYTDX_ENABLED || 'false' }}
          TRADING_DAY_CHECK_ENABLED: ${{ vars.TRADING_DAY_CHECK_ENABLED || secrets.TRADING_DAY_CHECK_ENABLED || 'true' }}
          
          # ==========================================
          # 系统配置
          # ==========================================
          LOG_LEVEL: INFO
          MAX_WORKERS: ${{ vars.MAX_WORKERS || secrets.MAX_WORKERS || '4' }}
          # 筹码分布：默认 false（云端接口不稳定）；需启用时在 Settings → Variables 添加 ENABLE_CHIP_DISTRIBUTION=true
          ENABLE_CHIP_DISTRIBUTION: ${{ vars.ENABLE_CHIP_DISTRIBUTION || secrets.ENABLE_CHIP_DISTRIBUTION || 'false' }}
          # 实时行情数据源优先级（未设置时由运行时按已配置的 Key 自动选择）
          # 可选值: tickplus, tencent, akshare_sina, efinance, akshare_em, tickflow, tushare
          # 推荐 TickPlus；未显式配置顺序时，TICKPLUS_API_KEY 自动启用 tickplus 优先。
          REALTIME_SOURCE_PRIORITY: ${{ vars.REALTIME_SOURCE_PRIORITY }}
          
        run: |
          # 解析自选股配置：
          # 1. Repository/Environment secrets 或 Repository variables（STOCK_LIST_CONFIG）
          # 2. 同名 Environment variables 注入的 runner 环境变量（STOCK_LIST）
          # 3. 最小默认值
          if [ -n "${STOCK_LIST_CONFIG:-}" ]; then
            export STOCK_LIST="$STOCK_LIST_CONFIG"
          elif [ -z "${STOCK_LIST:-}" ]; then
            export STOCK_LIST="600519"
          fi

          # 处理 LITELLM YAML 配置文件
          if [ -n "$LITELLM_CONFIG_YAML" ] && [ -n "$LITELLM_CONFIG" ]; then
            echo "📝 使用 GitHub Actions Secrets/Variables 中的 LITELLM_CONFIG_YAML 配置"
            # 确保目录存在
            mkdir -p "$(dirname "$LITELLM_CONFIG")"
            # 写入配置文件（覆盖已有文件）
            echo "$LITELLM_CONFIG_YAML" > "$LITELLM_CONFIG"
            echo "✅ LITELLM 配置文件已写入: $LITELLM_CONFIG"
          fi

          # 判断运行模式
          MODE="${{ github.event.inputs.mode || 'full' }}"
          
          echo "=========================================="
          echo "🚀 A股自选股智能分析系统"
          echo "=========================================="
          echo "⏰ 时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "🎯 运行模式: $MODE"
          echo "📊 自选股: $STOCK_LIST"
          echo "📝 报告类型: $REPORT_TYPE"
          echo ""
          echo "=========================================="
          echo "📋 配置检查"
          echo "=========================================="
          echo "【AI 配置】"
          if [ -n "$LITELLM_CONFIG" ] || [ -n "$LITELLM_API_KEY" ] || [ -n "$LITELLM_MODEL" ] || [ -n "$LLM_CHANNELS" ] || [ -n "$MODELFLARE_KEY" ] || [ -n "$LLM_MODELFLARE_API_KEY" ] || [ -n "$LLM_MODELFLARE_API_KEYS" ] || [ -n "$ANSPIRE_API_KEYS" ]; then
            echo "  LiteLLM: ✅ 已配置"
          else
            echo "  LiteLLM: ❌ 未配置"
          fi
          echo "  Gemini API Key: $([ -n "$GEMINI_API_KEY" ] && echo '✅ 已配置' || echo '❌ 未配置')"
          echo "  DeepSeek Key:   $([ -n "$DEEPSEEK_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Modelflare Key: $([ -n "$MODELFLARE_KEY" ] || [ -n "$LLM_MODELFLARE_API_KEY" ] || [ -n "$LLM_MODELFLARE_API_KEYS" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Anspire Key:    $([ -n "$ANSPIRE_API_KEYS" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  AIHubMix Key:   $([ -n "$AIHUBMIX_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  OpenAI API Key: $([ -n "$OPENAI_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Anthropic Key:  $([ -n "$ANTHROPIC_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo ""
          echo "【数据源】"
          echo "  Tushare Token: $([ -n "$TUSHARE_TOKEN" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  TickPlus (recommended): $([ -n "$TICKPLUS_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  TickFlow:      $([ -n "$TICKFLOW_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  FXMacroData:   $([ -n "$FXMACRODATA_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置（仅公开 USD 数据）')"
          if [ -n "$LONGBRIDGE_APP_KEY" ] && [ -n "$LONGBRIDGE_APP_SECRET" ] && [ -n "$LONGBRIDGE_ACCESS_TOKEN" ]; then
            echo "  Longbridge: ✅ 已配置（Legacy API Key）"
          elif [ -n "$LONGBRIDGE_OAUTH_CLIENT_ID" ] || { [ -n "$LONGBRIDGE_APP_KEY" ] && [ -z "$LONGBRIDGE_ACCESS_TOKEN" ]; }; then
            echo "  Longbridge: $([ -n "$LONGBRIDGE_OAUTH_TOKEN_CACHE_B64" ] && echo '✅ 已配置（OAuth token cache）' || echo '🟡 已配置 OAuth client，缺少 token cache')"
          else
            echo "  Longbridge: ⚪ 未配置（仅 YFinance 等，无长桥调用）"
          fi
          echo ""
          echo "【搜索引擎】"
          echo "  Bocha API Keys: $([ -n "$BOCHA_API_KEYS" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Tavily API Keys: $([ -n "$TAVILY_API_KEYS" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  SerpAPI Keys: $([ -n "$SERPAPI_API_KEYS" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  MiniMax API Keys: $([ -n "$MINIMAX_API_KEYS" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Brave API Keys: $([ -n "$BRAVE_API_KEYS" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  SearXNG Base URLs: $([ -n "$SEARXNG_BASE_URLS" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          case "${SEARXNG_PUBLIC_INSTANCES_ENABLED,,}" in
            0|false|no|off)
              echo "  SearXNG Public Instances: ❌ 已禁用"
              ;;
            "")
              echo "  SearXNG Public Instances: ⚪ 默认关闭（公共实例普遍限流，如需启用请显式设为 true）"
              ;;
            *)
              echo "  SearXNG Public Instances: ✅ 已启用"
              ;;
          esac
          echo ""
          echo "【通知渠道】"
          echo "  PushPlus: $([ -n "$PUSHPLUS_TOKEN" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  ntfy: $([ -n "$NTFY_URL" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Gotify: $([ -n "$GOTIFY_URL" ] && [ -n "$GOTIFY_TOKEN" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  企业微信: $([ -n "$WECHAT_WEBHOOK_URL" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  钉钉: $( [ -n "$DINGTALK_WEBHOOK_URL" ] && echo '✅ 已配置' || echo '⚪ 未配置' )"
          echo "  飞书: $( ([ -n "$FEISHU_WEBHOOK_URL" ] || ([ -n "$FEISHU_APP_ID" ] && [ -n "$FEISHU_APP_SECRET" ] && [ -n "$FEISHU_CHAT_ID" ]) ) && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Telegram: $([ -n "$TELEGRAM_BOT_TOKEN" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Discord: $([ -n "$DISCORD_WEBHOOK_URL" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  AstrBot: $([ -n "$ASTRBOT_URL" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Slack: $(([ -n "$SLACK_WEBHOOK_URL" ] || ([ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_CHANNEL_ID" ])) && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "=========================================="
          echo ""
          
          # 1. 暫存並隱藏 TG 與 Email 變數，避免 main.py 內建推播寄出簡體信或用大盤長文洗版 TG
          REAL_TG_TOKEN="$(printf '%s' "${TELEGRAM_BOT_TOKEN:-}" | tr -d '[:space:]' | sed 's/^bot//i')"
          REAL_TG_CHAT_ID="$(printf '%s' "${TELEGRAM_CHAT_ID:-}" | tr -d '[:space:]')"
          REAL_EMAIL_SENDER="$(printf '%s' "${EMAIL_SENDER:-}" | tr -d '[:space:]')"
          REAL_EMAIL_PASSWORD="$(printf '%s' "${EMAIL_PASSWORD:-}" | tr -d '[:space:]')"
          REAL_EMAIL_RECEIVERS="${EMAIL_RECEIVERS:-}"
          unset TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID EMAIL_SENDER EMAIL_PASSWORD EMAIL_RECEIVERS

          # 強制確保產出完整版 .md 報告（避免 Variables 設為 brief 導致 .md 只有幾行摘要）
          export REPORT_TYPE="simple"

          # 檢查是否為 Telegram 傳來的臨時查股指令
          CUSTOM_STOCKS="$(printf '%s' "${{ github.event.inputs.custom_stocks }}" | tr -d '[:space:]')"
          STATUS_MSG_ID="$(printf '%s' "${{ github.event.inputs.status_msg_id }}" | tr -d '[:space:]')"
          IS_CUSTOM_QUERY="false"

          FORCE_RUN_ARG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_RUN_ARG="--force-run"
            echo "⚡ 已启用强制运行模式（跳过交易日检查）"
          fi

          if [ -n "$CUSTOM_STOCKS" ]; then
            FORCE_RUN_ARG="--force-run"
            if [ "$CUSTOM_STOCKS" != "ALL" ]; then
              export STOCK_LIST="$CUSTOM_STOCKS"
              export GEMINI_MODEL="${TG_GEMINI_MODEL:-$GEMINI_MODEL}"
              export GEMINI_MODEL_FALLBACK="${TG_GEMINI_MODEL_FALLBACK:-$GEMINI_MODEL_FALLBACK}"
              export GEMINI_REQUEST_DELAY="0"
              export ANALYSIS_DELAY="0"
              MODE="stocks-only"
              IS_CUSTOM_QUERY="true"
              echo "📱 收到 TG 指定查股：$STOCK_LIST（極速單查模式，使用 $GEMINI_MODEL）"
            else
              echo "📱 收到 TG 全清單查股指令"
            fi
          fi

          # 1.5 自動雙重確認台股 .TW (上市) 與 .TWO (上櫃)，並將 TG 進度原地更新為 [2/3]
          export REAL_TG_TOKEN REAL_TG_CHAT_ID STATUS_MSG_ID IS_CUSTOM_QUERY
          STOCK_LIST="$(python - << 'PYEOF'
          import os, requests

          stocks = [s.strip() for s in os.getenv('STOCK_LIST', '').split(',') if s.strip()]
          is_custom = os.getenv('IS_CUSTOM_QUERY', 'false') == 'true'
          resolved = []
          headers = {'User-Agent': 'Mozilla/5.0'}

          def has_yahoo_data(symbol):
              try:
                  r = requests.get(f'https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?interval=1d&range=5d', headers=headers, timeout=5)
                  if r.status_code == 200:
                      q = r.json().get('chart', {}).get('result', [{}])[0].get('indicators', {}).get('quote', [{}])[0].get('close', [])
                      return any(v is not None for v in q)
              except Exception:
                  pass
              return False

          for s in stocks:
              u = s.upper()
              # TG 單查時 Worker 已驗證過 .TW/.TWO，直接跳過重複檢查以節省時間
              if (not is_custom) and u.endswith('.TW') and not has_yahoo_data(u) and has_yahoo_data(u[:-3] + '.TWO'):
                  u = u[:-3] + '.TWO'
              resolved.append(u)

          final_list = ','.join(resolved)
          tg_token = os.getenv('REAL_TG_TOKEN', '').strip()
          tg_chat = os.getenv('REAL_TG_CHAT_ID', '').strip()
          msg_id = os.getenv('STATUS_MSG_ID', '').strip()
          if tg_token and tg_chat and msg_id:
              try:
                  requests.post(
                      f'https://api.telegram.org/bot{tg_token}/editMessageText',
                      json={
                          'chat_id': tg_chat,
                          'message_id': int(msg_id),
                          'text': f'🚀 [2/3] 雲端主機已就緒！\n🎯 正在抓取 {final_list} 最新股價、籌碼與新聞，並由 Gemini AI 極速撰寫報告中（約需 25～40 秒）...'
                      },
                      timeout=5
                  )
              except Exception:
                  pass
          print(final_list)
          PYEOF
          )"
          export STOCK_LIST

          # 2. 执行分析（產出完整報告至 reports/）
          if [ "$MODE" = "market-only" ]; then
            python main.py --market-review $FORCE_RUN_ARG
          elif [ "$MODE" = "stocks-only" ]; then
            python main.py --no-market-review $FORCE_RUN_ARG
          else
            python main.py $FORCE_RUN_ARG
          fi

          # 3. 將 reports/ 所有 .md 轉為道地台灣繁體中文，發送結果並自動刪除 TG 過渡訊息
          export REAL_TG_TOKEN REAL_TG_CHAT_ID REAL_EMAIL_SENDER REAL_EMAIL_PASSWORD REAL_EMAIL_RECEIVERS IS_CUSTOM_QUERY STATUS_MSG_ID
          python - << 'EOF'
          import os, glob, re, smtplib, ssl, datetime, requests
          from email.message import EmailMessage
          from opencc import OpenCC

          cc = OpenCC('s2twp')
          TERM_FIXES = {
              '覆盤': '復盤',
              '行情繫統': '行情系統',
              '回撥': '回檔',
              '英偉達': '輝達',
              '特朗普': '川普',
              '止損': '停損',
              '儀表盤': '儀表板',
              '儀錶盤': '儀表板',
              '只股票': '檔股票',
              'TAIWAN SEMICONDUCTOR MANUFACTUR': '台積電',
              'COMPEQ MANUFACTURING': '華通',
              'CENTRAL REINSURANCE': '中再保',
              'KEDGE CONSTRUCTION CO': '根基',
              'JETWELL COMPUTER CO': '大綜',
          }

          def to_tw(text: str) -> str:
              res = cc.convert(text)
              for k, v in TERM_FIXES.items():
                  res = res.replace(k, v)
              return res

          # (A) 將 reports/ 下所有 .md 完整報告轉為台灣繁體中文
          md_files = sorted(glob.glob('reports/**/*.md', recursive=True))
          for path in md_files:
              if os.path.isfile(path):
                  with open(path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(to_tw(content))
          print(f"✅ 已將 {len(md_files)} 份完整報告轉為台灣繁體中文")

          # (B) 從完整報告中提取「個股簡短摘要（含一句話決策）+ 大盤核心結論」作為 TG 與 Email 內文
          summary_parts = []
          for path in md_files:
              name = os.path.basename(path)
              with open(path, 'r', encoding='utf-8') as f:
                  text = f.read()
              if name.startswith('report_'):
                  sections = text.split('\n---\n')
                  head_lines = []
                  for line in sections[0].splitlines():
                      if line.strip():
                          head_lines.append(line.replace('# ', '').replace('## ', ''))
                  stock_briefs = []
                  for sec in sections[1:]:
                      title_m = re.search(r'^##\s+(.+)$', sec, re.M)
                      dec_m = re.search(r'\*\*一句話決策\*\*[:：]\s*(.+)$', sec, re.M)
                      if title_m and dec_m:
                          t = title_m.group(1).strip()
                          d = dec_m.group(1).strip()
                          stock_briefs.append(f"• {t}\n  └ {d}")
                  if stock_briefs:
                      head_lines.append("\n💬 【個股一句話決策】")
                      head_lines.extend(stock_briefs)
                  summary_parts.insert(0, '\n'.join(head_lines))
              elif name.startswith('market_review_'):
                  lines = []
                  for line in text.splitlines():
                      if line.startswith('# ') and ('大盤' in line) and ('🎯' not in line):
                          lines.append('\n📌 ' + line.lstrip('# ').strip())
                      elif line.startswith('> ') and ('下一市場' not in line):
                          lines.append('  └ ' + line[2:].strip())
                  if lines:
                      summary_parts.append('🌍 【台美股大盤核心摘要】' + '\n'.join(lines))

          today = (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).strftime('%Y-%m-%d')
          brief_text = '\n\n'.join(summary_parts).strip()
          if not brief_text:
              brief_text = f'📊 {today} 股票分析已完成，完整內容請見附件 .md 檔案。'
          else:
              brief_text += '\n\n📎 完整個股數據與分析請點開下方 .md 檔案查看。'

          # (C) 傳送到 Telegram：1 則繁體短摘要 + 完整 .md 檔案附件，並自動刪除過渡進度訊息
          tg_token = os.getenv('REAL_TG_TOKEN', '').strip()
          tg_chat = os.getenv('REAL_TG_CHAT_ID', '').strip()
          msg_id = os.getenv('STATUS_MSG_ID', '').strip()
          if tg_token and tg_chat and md_files:
              r = requests.post(
                  f'https://api.telegram.org/bot{tg_token}/sendMessage',
                  json={'chat_id': tg_chat, 'text': brief_text[:4000]}
              )
              print(f"✅ Telegram 摘要發送狀態: {r.status_code}")
              for fpath in md_files:
                  with open(fpath, 'rb') as fp:
                      r_doc = requests.post(
                          f'https://api.telegram.org/bot{tg_token}/sendDocument',
                          data={'chat_id': tg_chat, 'caption': f'📎 完整報告：{os.path.basename(fpath)}'},
                          files={'document': (os.path.basename(fpath), fp, 'text/markdown')}
                      )
                      print(f"✅ Telegram 檔案發送 ({os.path.basename(fpath)}): {r_doc.status_code}")

              # 自動刪除 [1/3]、[2/3] 過渡進度訊息，保持版面乾淨
              if msg_id:
                  try:
                      requests.post(
                          f'https://api.telegram.org/bot{tg_token}/deleteMessage',
                          json={'chat_id': tg_chat, 'message_id': int(msg_id)},
                          timeout=5
                      )
                      print(f"🧹 已自動清理 TG 過渡進度訊息 (ID: {msg_id})")
                  except Exception as e:
                      print(f"⚠️ 清理過渡訊息失敗: {e}")

          # (D) 傳送到 Email：僅在「每日排程」或「全清單查詢」時寄信（TG 單查個股不寄信避免洗版）
          is_custom = os.getenv('IS_CUSTOM_QUERY', 'false') == 'true'
          sender = os.getenv('REAL_EMAIL_SENDER', '').strip()
          password = os.getenv('REAL_EMAIL_PASSWORD', '').replace(' ', '').strip()
          receivers = [r.strip() for r in (os.getenv('REAL_EMAIL_RECEIVERS') or sender).split(',') if r.strip()]
          if (not is_custom) and sender and password and receivers and md_files:
              domain = sender.split('@')[-1].lower()
              hosts = {
                  'gmail.com': ('smtp.gmail.com', 465),
                  'yahoo.com': ('smtp.mail.yahoo.com', 465),
                  'yahoo.com.tw': ('smtp.mail.yahoo.com', 465),
                  'outlook.com': ('smtp-mail.outlook.com', 587),
                  'hotmail.com': ('smtp-mail.outlook.com', 587),
                  'live.com': ('smtp-mail.outlook.com', 587),
              }
              host, port = hosts.get(domain, ('smtp.' + domain, 465))
              msg = EmailMessage()
              msg['Subject'] = f'📊 {today} 每日股票分析報告（含完整 .md 附件）'
              msg['From'] = sender
              msg['To'] = ', '.join(receivers)
              msg.set_content(brief_text)
              for fpath in md_files:
                  with open(fpath, 'rb') as fp:
                      msg.add_attachment(fp.read(), maintype='text', subtype='markdown', filename=os.path.basename(fpath))
              try:
                  if port == 465:
                      with smtplib.SMTP_SSL(host, port, context=ssl.create_default_context(), timeout=30) as s:
                          s.login(sender, password)
                          s.send_message(msg)
                  else:
                      with smtplib.SMTP(host, port, timeout=30) as s:
                          s.starttls(context=ssl.create_default_context())
                          s.login(sender, password)
                          s.send_message(msg)
                  print(f'✅ 已將繁體摘要與 {len(md_files)} 個 .md 附件寄到 Email：{", ".join(receivers)}')
              except Exception as e:
                  print(f'⚠️ Email 寄送失敗：{e}')
          EOF
      
      - name: 上传分析报告
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: analysis-reports-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 30
      
      - name: 显示运行结果
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "📊 分析完成"
          echo "=========================================="
          if [ -d "reports" ] && [ "$(ls -A reports 2>/dev/null)" ]; then
            echo "生成的报告:"
            ls -la reports/
          else
            echo "⚠️ 未生成报告文件"
          fi
          echo ""
          if [ -f "logs/stock_analysis_$(date +%Y%m%d).log" ]; then
            echo "📜 最近日志（最后 30 行）:"
            tail -30 logs/stock_analysis_*.log 2>/dev/null || echo "无日志"
          fi

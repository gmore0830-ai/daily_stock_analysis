name: 每日股票分析

on:
  # 定時排程改由 Cloudflare Worker Cron Trigger（45 8 * * MON-FRI = 台灣 16:45）呼叫 workflow_dispatch 觸發，
  # GitHub 內建 schedule 在 fork 上常延遲或不觸發，已移除。
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - market-only
          - stocks-only
      force_run:
        description: '强制运行（跳过交易日检查）'
        required: false
        default: false
        type: boolean
      custom_stocks:
        description: '指定查詢股票代號（由 TG 機器人自動帶入，留空則跑預設清單）'
        required: false
        default: ''
        type: string
      status_msg_id:
        description: 'TG 進度訊息 ID（由 TG 機器人自動帶入，完成後自動刪除）'
        required: false
        default: ''
        type: string

# 并发控制：同一时间只运行一个分析任务
concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    # 兼容误将 STOCK_LIST 配到同名 Environment variables 的场景；
    # 推荐位置仍是 Settings -> Secrets and variables -> Actions -> Repository variables。
    environment: STOCK_LIST
    # 添加超时限制，防止任务卡死
    timeout-minutes: ${{ fromJSON(vars.ANALYSIS_TIMEOUT_MINUTES || '45') }}
    # Runner 預設為 UTC；設為台灣時間（UTC+8，與 Docker 映像的 TZ 一致），
    # 避免台灣 00:00～08:00 觸發時報告日期、檔名與日誌檔名落在前一天
    env:
      TZ: ${{ vars.TZ || 'Asia/Taipei' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      
      - name: 设置 Python 环境
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: 快取已安裝的 Python 完整環境
        id: py-env-cache
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/Python
          # key 含 Python 補丁版本：runner 升級 3.11.x 時自動重建，避免還原到舊版本目錄導致套件缺失
          # 額外安裝的套件（opencc 等）有變動時，請同步調整下方 v2 版本前綴
          key: ${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-full-v2-${{ hashFiles('requirements.txt') }}
      
      - name: 安装依赖（快取命中時自動 0 秒跳過）
        if: steps.py-env-cache.outputs.cache-hit != 'true'
        run: |
          grep -v -i "futu" requirements.txt > requirements_fast.txt
          pip install --prefer-binary -r requirements_fast.txt opencc-python-reimplemented
      
      - name: 创建必要目录
        run: |
          mkdir -p data logs reports
      
      - name: 执行股票分析
        env:
          # ==========================================
          # AI 配置
          # ==========================================
          GENERATION_BACKEND: ${{ vars.GENERATION_BACKEND || secrets.GENERATION_BACKEND }}
          GENERATION_FALLBACK_BACKEND: ${{ vars.GENERATION_FALLBACK_BACKEND || secrets.GENERATION_FALLBACK_BACKEND || 'litellm' }}
          GENERATION_BACKEND_TIMEOUT_SECONDS: ${{ vars.GENERATION_BACKEND_TIMEOUT_SECONDS || secrets.GENERATION_BACKEND_TIMEOUT_SECONDS }}
          GENERATION_BACKEND_MAX_OUTPUT_BYTES: ${{ vars.GENERATION_BACKEND_MAX_OUTPUT_BYTES || secrets.GENERATION_BACKEND_MAX_OUTPUT_BYTES }}
          GENERATION_BACKEND_MAX_CONCURRENCY: ${{ vars.GENERATION_BACKEND_MAX_CONCURRENCY || secrets.GENERATION_BACKEND_MAX_CONCURRENCY }}
          LOCAL_CLI_BACKEND_MAX_CONCURRENCY: ${{ vars.LOCAL_CLI_BACKEND_MAX_CONCURRENCY || secrets.LOCAL_CLI_BACKEND_MAX_CONCURRENCY }}
          AGENT_GENERATION_BACKEND: ${{ vars.AGENT_GENERATION_BACKEND || secrets.AGENT_GENERATION_BACKEND }}
          # LITELLM_CONFIG
          LITELLM_CONFIG: ${{ vars.LITELLM_CONFIG || secrets.LITELLM_CONFIG }}
          LITELLM_CONFIG_YAML: ${{ vars.LITELLM_CONFIG_YAML || secrets.LITELLM_CONFIG_YAML }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || secrets.LITELLM_MODEL }}
          LITELLM_FALLBACK_MODELS: ${{ vars.LITELLM_FALLBACK_MODELS || secrets.LITELLM_FALLBACK_MODELS }}
          AGENT_LITELLM_MODEL: ${{ vars.AGENT_LITELLM_MODEL || secrets.AGENT_LITELLM_MODEL }}
          VISION_MODEL: ${{ vars.VISION_MODEL || secrets.VISION_MODEL }}
          OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL || secrets.OPENAI_VISION_MODEL }}
          VISION_PROVIDER_PRIORITY: ${{ vars.VISION_PROVIDER_PRIORITY || secrets.VISION_PROVIDER_PRIORITY }}
          LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE || secrets.LLM_TEMPERATURE }}
          LLM_USAGE_HMAC_SECRET: ${{ secrets.LLM_USAGE_HMAC_SECRET }}
          LLM_USAGE_HMAC_KEY_VERSION: ${{ vars.LLM_USAGE_HMAC_KEY_VERSION || secrets.LLM_USAGE_HMAC_KEY_VERSION }}
          LLM_PROMPT_CACHE_TELEMETRY_ENABLED: ${{ vars.LLM_PROMPT_CACHE_TELEMETRY_ENABLED || secrets.LLM_PROMPT_CACHE_TELEMETRY_ENABLED }}
          LLM_PROMPT_CACHE_HINTS_ENABLED: ${{ vars.LLM_PROMPT_CACHE_HINTS_ENABLED || secrets.LLM_PROMPT_CACHE_HINTS_ENABLED }}
          LLM_PROMPT_CACHE_DIAGNOSTICS_LEVEL: ${{ vars.LLM_PROMPT_CACHE_DIAGNOSTICS_LEVEL || secrets.LLM_PROMPT_CACHE_DIAGNOSTICS_LEVEL }}
          LLM_CHANNELS: ${{ vars.LLM_CHANNELS || secrets.LLM_CHANNELS }}
          # Modelflare：只需 MODELFLARE_KEY；以下渠道配置供高级覆盖。
          MODELFLARE_KEY: ${{ secrets.MODELFLARE_KEY }}
          LLM_MODELFLARE_PROTOCOL: ${{ vars.LLM_MODELFLARE_PROTOCOL || secrets.LLM_MODELFLARE_PROTOCOL }}
          LLM_MODELFLARE_API_SURFACE: ${{ vars.LLM_MODELFLARE_API_SURFACE || secrets.LLM_MODELFLARE_API_SURFACE }}
          LLM_MODELFLARE_BASE_URL: ${{ vars.LLM_MODELFLARE_BASE_URL || secrets.LLM_MODELFLARE_BASE_URL }}
          LLM_MODELFLARE_API_KEY: ${{ secrets.LLM_MODELFLARE_API_KEY }}
          LLM_MODELFLARE_API_KEYS: ${{ secrets.LLM_MODELFLARE_API_KEYS }}
          LLM_MODELFLARE_MODELS: ${{ vars.LLM_MODELFLARE_MODELS || secrets.LLM_MODELFLARE_MODELS }}
          LLM_MODELFLARE_ENABLED: ${{ vars.LLM_MODELFLARE_ENABLED || secrets.LLM_MODELFLARE_ENABLED }}
          LLM_MODELFLARE_EXTRA_HEADERS: ${{ vars.LLM_MODELFLARE_EXTRA_HEADERS || secrets.LLM_MODELFLARE_EXTRA_HEADERS }}
          # Hermes 是本地 loopback generation preset；API Key 只从 Secrets 注入。
          # GitHub-hosted runner 的 127.0.0.1 不是用户电脑，本配置通常只适合 self-hosted runner。
          LLM_HERMES_PROTOCOL: ${{ vars.LLM_HERMES_PROTOCOL || secrets.LLM_HERMES_PROTOCOL }}
          LLM_HERMES_API_SURFACE: ${{ vars.LLM_HERMES_API_SURFACE || secrets.LLM_HERMES_API_SURFACE }}
          LLM_HERMES_BASE_URL: ${{ vars.LLM_HERMES_BASE_URL || secrets.LLM_HERMES_BASE_URL }}
          LLM_HERMES_API_KEY: ${{ secrets.LLM_HERMES_API_KEY }}
          LLM_HERMES_MODELS: ${{ vars.LLM_HERMES_MODELS || secrets.LLM_HERMES_MODELS }}
          LLM_HERMES_ENABLED: ${{ vars.LLM_HERMES_ENABLED || secrets.LLM_HERMES_ENABLED }}

          # Gemini AI（主选）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GEMINI_MODEL_FALLBACK: ${{ vars.GEMINI_MODEL_FALLBACK || secrets.GEMINI_MODEL_FALLBACK || 'gemini-3.5-flash-lite' }}
          GEMINI_REQUEST_DELAY: ${{ vars.GEMINI_REQUEST_DELAY || '10' }}
          # Gemini 3+ 思考強度（minimal/low/medium/high）：預設 high 時單檔 160~280 秒，Hydrogen 還可能把輸出上限用在思考上導致 JSON 被截斷。可用 repo 變數覆寫
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL || secrets.GEMINI_THINKING_LEVEL || 'low' }}
          # TG 指定查股（極速單查）專用模型，可用 repo 變數覆蓋
          TG_GEMINI_MODEL: ${{ vars.TG_GEMINI_MODEL || 'gemini-3.8-flash' }}
          TG_GEMINI_MODEL_FALLBACK: ${{ vars.TG_GEMINI_MODEL_FALLBACK || 'gemini-3.6-flash' }}
          
          # AIHubMix（优先于 OPENAI_API_KEY，自动适配 base_url，推荐国内用户）
          AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}

          # OpenAI 兼容 API（备选）
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}

          # DeepSeek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_KEYS: ${{ secrets.DEEPSEEK_API_KEYS }}
          
          # Anthropic / Claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEYS: ${{ secrets.ANTHROPIC_API_KEYS }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || secrets.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}

          # LLM 渠道模式（常见渠道名需显式映射，GitHub Actions 不会自动导入任意 Secret/Variable）
